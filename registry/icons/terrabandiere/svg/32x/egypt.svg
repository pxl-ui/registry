<svg
  width="32"
  height="32"
  viewBox="0 0 32 32"
  xmlns="http://www.w3.org/2000/svg">
  <title>Egypt</title>
  <g id="borders">
    <rect
      id="borderTop"
      x="1"
      y="0"
      width="30"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderLeft"
      x="0"
      y="1"
      width="1"
      height="18"
      fill="currentColor"
    />
    <rect
      id="borderBottom"
      x="1"
      y="19"
      width="30"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderRight"
      x="31"
      y="1"
      width="1"
      height="18"
      fill="currentColor"
    />
  </g>
  <g id="flag">
    <path
      id="Red"
      fill="#d01515"
      d="m 1,1 h 30 v 6 h -30 z" />
    <path
      id="White"
      fill="#ffffff"
      d="m 1,7 h 30 v 6 h -30 z" />
    <path
      id="Black"
      fill="#000000"
      d="m 1,13 h 30 v 6 h -30 z" />
    <path
      id="SaladinEagleWing1"
      fill="#d99740"
      d="m 14,9 h 4 v 1 h -4 z" />
    <path
      id="SaladinEagleWing2"
      fill="#d99740"
      d="m 13,8 h 1 v 1 h -1 z" />
    <path
      id="SaladinEagleWing3"
      fill="#d99740"
      d="m 18,8 h 1 v 1 h -1 z" />
    <path
      id="SaladinEagleBody"
      fill="#fbd1b7"
      d="m 15,9 h 2 v 2 h -2 z" />
    <path
      id="SaladinEagleLegs1"
      fill="#ffcc80"
      d="m 13,10 v 1 h 1 v -1 z m 1,1 v 1 h 1 v -1 z" />
    <path
      id="SaladinEagleLegs2"
      fill="#ffcc80"
      d="m 18,10 v 1 h 1 v -1 z m 0,1 h -1 v 1 h 1 z" />
    <path
      id="SaladinEagleHead"
      fill="#ffcc80"
      d="m 15,8 h 1 v 1 h -1 z" />
