<svg
  width="32"
  height="32"
  viewBox="0 0 32 20"
  xmlns="http://www.w3.org/2000/svg">
  <title>France</title>
  <g id="borders">
    <rect
      id="borderTop"
      x="1"
      y="0"
      width="30"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderLeft"
      x="0"
      y="1"
      width="1"
      height="18"
      fill="currentColor"
    />
    <rect
      id="borderBottom"
      x="1"
      y="19"
      width="30"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderRight"
      x="31"
      y="1"
      width="1"
      height="18"
      fill="currentColor"
    />
  </g>
  <g id="flag">
    <path id="Blue"
      fill="#142269"
      d="m 1,1 h 10 v 18 h -10 z" />
    <path 
      id="White"
      fill="#ffffff" 
      d="m 11,1 h 10 v 18 h -10 z" />
    <path 
      id="Red"
      fill="#d01515" 
      d="m 21,1 h 10 v 18 h -10 z" />
  </g>
</svg>
