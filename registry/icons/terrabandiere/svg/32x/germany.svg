<svg
  width="32"
  height="32"
  viewBox="0 0 32 32"
  version="1.1"
  xmlns="http://www.w3.org/2000/svg">
  <title>Germany</title>
  <g id="borders">
    <rect
      id="borderTop"
      x="1"
      y="0"
      width="30"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderLeft"
      x="0"
      y="1"
      width="1"
      height="18"
      fill="currentColor"
    />
    <rect
      id="borderBottom"
      x="1"
      y="19"
      width="30"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderRight"
      x="31"
      y="1"
      width="1"
      height="18"
      fill="currentColor"
    />
  </g>
  <g id="flag">
    <path
      id="Black"
      fill="#000000"
      d="m 1,1 h 30 v 6 h -30 z" />
    <path
      id="Red"
      fill="#fd1c1c"
      d="m 1,7 h 30 v 6 h -30 z" />
    <path
      id="Yellow"
      fill="#fff700"
      d="m 1,13 h 30 v 6 h -30 z" />
  </g>
</svg>