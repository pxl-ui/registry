<svg
  width="16"
  height="16"
  viewBox="0 0 16 12" 
  xmlns="http://www.w3.org/2000/svg">
  <title>Russia</title>
  <g id="borders">
    <rect
      id="borderTop"
      x="1"
      y="0"
      width="14"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderLeft"
      x="0"
      y="1"
      width="1"
      height="10"
      fill="currentColor"
    />
    <rect
      id="borderBottom"
      x="1"
      y="11"
      width="14"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderRight"
      x="15"
      y="1"
      width="1"
      height="10"
      fill="currentColor"
    />
  </g>
  <g id="flag">
    <path
      id="White"
      fill="#ffffff"
      d="m 1,1 h 14 v 10 h -14 z" />
    <path
      id="Blue"
      fill="#1c4fb0"
      d="m 1,4 h 14 v 4 h -14 z" />
    <path
      id="Red"
      fill="#d01515"
      d="m 1,8 h 14 v 3 h -14 z" />
  </g>
</svg>