<svg
  width="16"
  height="16"
  viewBox="0 0 16 12" 
  xmlns="http://www.w3.org/2000/svg">
  <title>China</title>
  <g id="borders">
    <rect
      id="borderTop"
      x="1"
      y="0"
      width="14"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderLeft"
      x="0"
      y="1"
      width="1"
      height="10"
      fill="currentColor"
    />
    <rect
      id="borderBottom"
      x="1"
      y="11"
      width="14"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderRight"
      x="15"
      y="1"
      width="1"
      height="10"
      fill="currentColor"
    />
  </g>
  <g id="flag">
    <path
      id="Red"
