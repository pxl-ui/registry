      d="m 3,2 v 1 h -1 v 1 h 1 v 1 h 1 v -1 h 1 v -1 h -1 v -1 z m 1,3 v 1 h 1 v -1 z m -1,0 h -1 v 1 h 1 z" />
    <path
      id="SmallStars"
      fill="#fff700"
      d="m 6,2 v 1 h 1 v -1 z m 2,1 v 1 h 1 v -1 z m 0,2 v 1 h 1 v -1 z m -2,1 v 1 h 1 v -1 z" />
  </g>
