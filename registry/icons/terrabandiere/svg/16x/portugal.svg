<svg
  width="16"
  height="16"
  viewBox="0 0 16 12" 
  xmlns="http://www.w3.org/2000/svg">
  <title>Portugal</title>
  <g id="borders">
    <rect
      id="borderTop"
      x="1"
      y="0"
      width="14"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderLeft"
      x="0"
      y="1"
      width="1"
      height="10"
      fill="currentColor"
    />
    <rect
      id="borderBottom"
      x="1"
      y="11"
      width="14"
      height="1"
      fill="currentColor"
    />
    <rect
      id="borderRight"
      x="15"
      y="1"
      width="1"
      height="10"
      fill="currentColor"
    />
  </g>
  <g id="flag">
    <path
      id="Green"
      fill="#00662c"
      d="m 1,1 h 6 v 10 h -6 z" />
    <path
      id="Red"
      fill="#fd1c1c"
      d="m 7,1 h 8 v 10 h -8 z" />
    <path
      id="SphereBorder"
      fill="#fff700"
      d="m 6,3 v 1 h 2 v -1 z m -2,2 v 2 h 1 v -2 z m 5,0 v 2 h 1 v -2 z m -3,3 v 1 h 2 v -1 z" />
    <path
      id="SphereInner"
      fill="#ff9d00"
      d="m 5,4 v 2 h 1 v -1 h 1 v -1 z m 3,0 v 1 h 1 v -1 z m 0,2 v 1 h -1 v 1 h 2 v -2 z m -3,1 v 1 h 1 v -1 z" />
    <path
      id="SphereShield"
      fill="#ffffff"
      d="m 6,5 h 2 v 2 h -2 z" />
  </g>
</svg>